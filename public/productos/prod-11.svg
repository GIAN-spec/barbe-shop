<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#2a241b"/>
      <stop offset="55%" stop-color="#151310"/>
      <stop offset="100%" stop-color="#0b0a09"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d0c0a"/>
      <stop offset="28%" stop-color="#2a1d10"/>
      <stop offset="70%" stop-color="#2a1d10"/>
      <stop offset="100%" stop-color="#090807"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c1915"/>
      <stop offset="35%" stop-color="#3a332a"/>
      <stop offset="70%" stop-color="#221e18"/>
      <stop offset="100%" stop-color="#12100d"/>
    </linearGradient>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7018"/>
      <stop offset="45%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#8a6212"/>
    </linearGradient>
    <linearGradient id="specGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.65)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Fondo de estudio fotográfico -->
  <rect width="600" height="450" fill="url(#bgGlow)"/>
  <circle cx="300" cy="210" r="175" fill="#e8b941" opacity="0.06"/>
  <line x1="0" y1="378" x2="600" y2="378" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

        <ellipse cx="300" cy="398" rx="110" ry="16" fill="rgba(0,0,0,0.65)" />
      <!-- Tapa dorada octogonal -->
      <rect x="268" y="96" width="64" height="44" rx="8" fill="url(#goldMetal)" stroke="#e8b941" stroke-width="1.4"/>
      <rect x="278" y="140" width="44" height="18" fill="#18181b"/>
      <!-- Frasco de vidrio cuadrado elegante -->
      <rect x="206" y="158" width="188" height="234" rx="22" fill="url(#bodyGrad)" stroke="#e8b941" stroke-width="1.6"/>
      <rect x="220" y="170" width="22" height="210" rx="8" fill="url(#specGrad)" opacity="0.38"/>
      <!-- Etiqueta -->
      <rect x="226" y="198" width="148" height="154" rx="10" fill="#0d0c0a" stroke="#e8b941" stroke-width="1.5"/>
      <text x="300" y="226" text-anchor="middle" fill="#e8b941" font-family="Cinzel, Georgia, serif" font-size="9.5" font-weight="700" letter-spacing="2.5">CHINO BARBER</text>
      <line x1="252" y1="234" x2="348" y2="234" stroke="#e8b941" stroke-width="0.8" opacity="0.5"/>
      <text x="300" y="268" text-anchor="middle" fill="#ffffff" font-family="Cinzel, Georgia, serif" font-size="17" font-weight="800" letter-spacing="1.2">AFTERSHAVE</text>
      <text x="300" y="290" text-anchor="middle" fill="#d6d1c7" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.8">LOCIÓN REFRESCANTE CLÁSICA</text>
      <text x="300" y="332" text-anchor="middle" fill="#e8b941" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="10" font-weight="700">120 ml / 4.0 fl.oz</text>
</svg>
