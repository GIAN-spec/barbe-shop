<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#2a241b"/>
      <stop offset="55%" stop-color="#151310"/>
      <stop offset="100%" stop-color="#0b0a09"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d0c0a"/>
      <stop offset="28%" stop-color="#3a200c"/>
      <stop offset="70%" stop-color="#3a200c"/>
      <stop offset="100%" stop-color="#090807"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c1915"/>
      <stop offset="35%" stop-color="#3a332a"/>
      <stop offset="70%" stop-color="#221e18"/>
      <stop offset="100%" stop-color="#12100d"/>
    </linearGradient>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7018"/>
      <stop offset="45%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#8a6212"/>
    </linearGradient>
    <linearGradient id="specGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.65)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Fondo de estudio fotográfico -->
  <rect width="600" height="450" fill="url(#bgGlow)"/>
  <circle cx="300" cy="210" r="175" fill="#e8b941" opacity="0.06"/>
  <line x1="0" y1="378" x2="600" y2="378" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

        <ellipse cx="300" cy="400" rx="90" ry="15" fill="rgba(0,0,0,0.65)" />
      <!-- Bulbo de goma del gotero -->
      <path d="M282 95 C282 62, 318 62, 318 95 L322 130 L278 130 Z" fill="#18181b" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>
      <!-- Collar metálico dorado -->
      <rect x="270" y="128" width="60" height="28" rx="5" fill="url(#goldMetal)" stroke="#e8b941" stroke-width="1"/>
      <!-- Cuello del frasco -->
      <path d="M276 156 L324 156 L348 195 L252 195 Z" fill="url(#bodyGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <!-- Cuerpo de vidrio ámbar -->
      <rect x="232" y="190" width="136" height="205" rx="20" fill="url(#bodyGrad)" stroke="#e8b941" stroke-width="1.4"/>
      <rect x="244" y="198" width="18" height="188" rx="8" fill="url(#specGrad)" opacity="0.4"/>
      <!-- Etiqueta -->
      <rect x="242" y="222" width="116" height="148" rx="8" fill="#0d0c0a" stroke="#e8b941" stroke-width="1.4"/>
      <text x="300" y="246" text-anchor="middle" fill="#e8b941" font-family="Cinzel, Georgia, serif" font-size="8.5" font-weight="700" letter-spacing="2">CHINO BARBER</text>
      <line x1="262" y1="253" x2="338" y2="253" stroke="#e8b941" stroke-width="0.8" opacity="0.5"/>
      <text x="300" y="282" text-anchor="middle" fill="#ffffff" font-family="Cinzel, Georgia, serif" font-size="14.5" font-weight="800" letter-spacing="1">BEARD OIL</text>
      <text x="300" y="302" text-anchor="middle" fill="#d6d1c7" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.8">ACEITE DE ARGÁN & CEDRO</text>
      <text x="300" y="346" text-anchor="middle" fill="#e8b941" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="9.5" font-weight="700">30 ml / 1.0 fl.oz</text>
</svg>
