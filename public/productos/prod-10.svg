      <line x1="258" y1="224" x2="342" y2="224" stroke="#38bdf8" stroke-width="0.8" opacity="0.5"/>
      <text x="300" y="260" text-anchor="middle" fill="#ffffff" font-family="Cinzel, Georgia, serif" font-size="15.5" font-weight="800" letter-spacing="1">SHAVE GEL</text>
