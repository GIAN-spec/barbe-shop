<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#2a241b"/>
      <stop offset="55%" stop-color="#151310"/>
      <stop offset="100%" stop-color="#0b0a09"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d0c0a"/>
      <stop offset="28%" stop-color="#181715"/>
      <stop offset="70%" stop-color="#181715"/>
      <stop offset="100%" stop-color="#090807"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c1915"/>
      <stop offset="35%" stop-color="#3a332a"/>
      <stop offset="70%" stop-color="#221e18"/>
      <stop offset="100%" stop-color="#12100d"/>
    </linearGradient>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7018"/>
      <stop offset="45%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#8a6212"/>
    </linearGradient>
    <linearGradient id="specGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.65)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Fondo de estudio fotográfico -->
  <rect width="600" height="450" fill="url(#bgGlow)"/>
  <circle cx="300" cy="210" r="175" fill="#e8b941" opacity="0.06"/>
  <line x1="0" y1="378" x2="600" y2="378" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

        <!-- Sombra de piso -->
      <ellipse cx="300" cy="392" rx="135" ry="18" fill="rgba(0,0,0,0.65)" />
      <!-- Cuerpo del tarro -->
      <rect x="175" y="195" width="250" height="190" rx="26" fill="url(#bodyGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
      <!-- Brillo especular lateral -->
      <rect x="192" y="200" width="28" height="180" rx="10" fill="url(#specGrad)" opacity="0.35"/>
      <!-- Tapa rosca metálica -->
      <rect x="182" y="150" width="236" height="48" rx="12" fill="url(#lidGrad)" stroke="#e8b941" stroke-width="1.2"/>
      <line x1="182" y1="185" x2="418" y2="185" stroke="#e8b941" stroke-width="2" opacity="0.8"/>
      <!-- Etiqueta frontal -->
      <rect x="195" y="220" width="210" height="142" rx="10" fill="#0d0c0a" stroke="#e8b941" stroke-width="1.5"/>
      <rect x="201" y="226" width="198" height="130" rx="7" fill="none" stroke="#e8b941" stroke-width="0.6" stroke-dasharray="4 3" opacity="0.6"/>
      <text x="300" y="248" text-anchor="middle" fill="#e8b941" font-family="Cinzel, Georgia, serif" font-size="10" font-weight="700" letter-spacing="3">CHINO BARBER</text>
      <line x1="245" y1="255" x2="355" y2="255" stroke="#e8b941" stroke-width="0.8" opacity="0.5"/>
      <text x="300" y="284" text-anchor="middle" fill="#ffffff" font-family="Cinzel, Georgia, serif" font-size="19" font-weight="800" letter-spacing="1.5">MATTE CLAY</text>
      <text x="300" y="305" text-anchor="middle" fill="#d6d1c7" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.2">FIJACIÓN FUERTE · SIN BRILLO</text>
      <rect x="250" y="320" width="100" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="#e8b941" stroke-width="0.8"/>
      <text x="300" y="335" text-anchor="middle" fill="#e8b941" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="10" font-weight="700">100 g / 3.5 oz</text>
</svg>
